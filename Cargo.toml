[package]
name = "tree-sitter-aql"
description = "AQL (ArangoDB / Aquila Query Language) grammar for tree-sitter"
version = "0.1.0"
authors = ["Francisco Serrano Baptista"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "aql"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/FranciscoSerranoBaptista/tree-sitter-aql"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.25"
